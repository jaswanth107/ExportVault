# ---------------------------------------------------------------------------
# Render blueprint — FREE TIER configuration.
#
# IMPORTANT, and the reason this file looks unusual:
# Render has no free `type: worker`. Background workers, private services and
# cron jobs all start at a paid instance type. Only web services, Postgres and
# Key Value can run on `plan: free`.
#
# So on the free tier the export worker is deployed as a WEB service that binds
# a port and serves GET /health (see server/src/workers/health.server.ts). It is
# still a completely separate service and process from the API — the property
# the architecture actually depends on — it just satisfies Render's requirement
# that a free service listen on a port.
#
# Free-tier limitations you are accepting (all real, all documented):
#   * Services spin down after 15 minutes without traffic and share 750
#     instance-hours/month. A spun-down worker stops mid-export — which this
#     system handles: the job goes INTERRUPTED and Resume continues from the
#     last checkpoint. Nothing is duplicated or skipped.
#   * Free Key Value is in-memory only, so queued jobs are lost on restart.
#     Recoverable: the job row survives in Postgres and Resume re-enqueues it.
#
# PostgreSQL is NOT provisioned here. Render's free Postgres expires 30 days
# after creation, which would quietly kill the deployment; Neon's free plan does
# not expire. Set DATABASE_URL on both services to your Neon connection string —
# use the DIRECT (non-pooled) one, so Prisma migrations and prepared statements
# behave normally.
#
# TO RUN THIS PROPERLY (recommended for anything but a demo), change the two
# `plan: free` service entries to `plan: 0.5c-512mb` and set the worker back to
# `type: worker` — see render-production.yaml for that variant.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: exportvault-api
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/start-api.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string (use the DIRECT, non-pooled one)
      - key: REDIS_HOST
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false          # https://<your-project>.vercel.app
      - key: AWS_ACCESS_KEY_ID
        sync: false          # R2 access key id
      - key: AWS_SECRET_ACCESS_KEY
        sync: false          # R2 secret access key
      - key: AWS_REGION
        sync: false          # Supabase: your project region (e.g. ap-south-1). R2: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false          # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: S3_RESPONSE_OVERRIDES
        value: "0"           # Supabase Storage does not support them. Set "1" for R2/S3.
      - key: LOG_LEVEL
        value: info

  # Separate service and separate process from the API. Declared as `web`
  # only because Render's free tier has no worker type; it runs dist/worker.js
  # and serves /health so the platform keeps it alive.
  - type: web
    name: exportvault-worker
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/start-worker.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string (use the DIRECT, non-pooled one)
      - key: REDIS_HOST
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: port
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false          # Supabase: your project region (e.g. ap-south-1). R2: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: S3_RESPONSE_OVERRIDES
        value: "0"           # Supabase Storage does not support them. Set "1" for R2/S3.
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: EXPORT_BATCH_SIZE
        value: "1000"
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: exportvault-keyvalue
    plan: free
    # BullMQ must never have jobs evicted under memory pressure.
    maxmemoryPolicy: noeviction
    ipAllowList: []          # reachable only from inside the Render network
