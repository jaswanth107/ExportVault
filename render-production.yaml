# ---------------------------------------------------------------------------
# Render blueprint — PAID configuration (recommended beyond a demo).
#
# Differences from the free render.yaml:
#   * the worker is a real `type: worker` background service, not a web service
#     pretending to be one;
#   * nothing spins down, so an export is never interrupted by idle timeout;
#   * Postgres does not expire after 30 days;
#   * Key Value persists, so queued jobs survive a restart.
#
# Deploy with:  render blueprint launch --file render-production.yaml
# ---------------------------------------------------------------------------
services:
  - type: web
    name: exportvault-api
    runtime: docker
    plan: 0.5c-512mb
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/start-api.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exportvault-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false          # https://<your-project>.vercel.app
      - key: AWS_ACCESS_KEY_ID
        sync: false          # R2 access key id
      - key: AWS_SECRET_ACCESS_KEY
        sync: false          # R2 secret access key
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false          # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: LOG_LEVEL
        value: info

  # Separate service and separate process from the API. Declared as `web`
  # only because Render's free tier has no worker type; it runs dist/worker.js
  # and serves /health so the platform keeps it alive.
  - type: worker
    name: exportvault-worker
    runtime: docker
    plan: 0.5c-512mb
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/start-worker.sh
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exportvault-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: exportvault-keyvalue
          type: keyvalue
          property: port
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: EXPORT_BATCH_SIZE
        value: "1000"
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: exportvault-keyvalue
    plan: 256mb
    # BullMQ must never have jobs evicted under memory pressure.
    maxmemoryPolicy: noeviction
    ipAllowList: []          # reachable only from inside the Render network

databases:
  - name: exportvault-postgres
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
